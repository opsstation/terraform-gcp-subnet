#  description of this project
description: |-
  Terraform module subnet to create new modules using this as baseline

# How to use this project
usage: |-
  Here are some examples of how you can use this module in your inventory structure:


  ## Example: single


    ```hcl
   module "subnet" {
   source        = "opsstation/subnet/gcp"
   version       = "1.0.1"
   name          = ["dev"]
   environment   = "test"
   region        = "asia-northeast1"
   network       = module.vpc.subnet_id
   ip_cidr_range = ["10.10.1.0/24"]
   log_config = {
   enable               = true
   aggregation_interval = "INTERVAL_5_MIN"
   flow_sampling        = 0.5
   metadata             = "INCLUDE_ALL_METADATA"
   metadata_fields      = []
   filter_expr          = null
   }
   }
   ```

 ## Example: public-private

  ```hcl
  module "subnet" {
  source           = "opsstation/subnet/gcp"
  version          = "1.0.1"
  name = [
  "subnet-public-1",
  "subnet-public-2",
  "subnet-public-3",
  "subnet-private-1",
  "subnet-private-2",
  "subnet-private-3"
  ]
  environment      = "nonprod"
  region           = "asia-northeast1"
  subnet_type      = ["public", "public", "public", "private", "private", "private"]
  network          = module.vpc.subnet_id
  ip_cidr_range    = ["10.10.1.0/24", "10.10.2.0/24", "10.10.3.0/24", "10.10.4.0/24", "10.10.5.0/24", "10.10.6.0/24"]
  multiple_subnets = true
  }
  log_config = {
  enable               = true
  aggregation_interval = "INTERVAL_5_MIN"
  flow_sampling        = 0.5
  metadata             = "INCLUDE_ALL_METADATA"
  metadata_fields      = []
  filter_expr          = null
  }
  }
  ```